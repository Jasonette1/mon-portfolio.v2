<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Musée - Expérience 3D Interactive">
    <meta name="author" content="Youen Lassiaz">
    <meta name="theme-color" content="#120900">
    <title>Youen | Musée 3D</title>

    <link rel="icon" type="image/x-icon" href="assets/icons/favicon-perso.png">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon-perso.svg">

    <link rel="stylesheet" href="assets/css/musee.css">
</head>

<body>
    <!-- Loading Screen -->
    <div id="loader" class="loader">
        <div class="spinner"></div>
        <p>Chargement de l'expérience...</p>
    </div>

    <!-- Canvas 3D WebGL -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Back Button (shown after animation) -->
    <a href="perso.html" id="back-button" class="back-button hidden" aria-label="Retour à l'index personnel">
        <span aria-hidden="true">&lt;&lt;</span> Retour
    </a>

    <!-- Bips de l'ordinateur de l'autel (bouton visible tout près de l'écran) -->
    <button type="button" id="bouton-son" class="bouton-son hidden" aria-pressed="true">Son</button>

    <!-- Voiles de la mise en route de l'ordinateur : version « moins d'animations », puis relais vers la galerie -->
    <div id="voile-calme" class="voile voile--calme" aria-hidden="true" hidden></div>
    <div id="voile-final" class="voile voile--final" aria-hidden="true" hidden></div>

    <!-- Three.js Import Map & Library -->
    <script type="importmap">
        {
            "imports": {
                "three": "./assets/js/libs/three.module.js"
            }
        }
    </script>
    <!-- Temple Scene Script -->
    <script type="module" src="assets/js/musee-scene.js"></script>
</body>

</html>
