<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Index personnel - Projets et pensées">
    <meta name="keywords" content="pédagogie, éducation, technologies, ascii, obsidian, portal">
    <meta name="author" content="Youen Lassiaz">
    <meta name="theme-color" content="#120900">
    <meta name="robots" content="index, follow">

    <title>Youen | Index Perso</title>

    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-perso-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="assets/icons/favicon-perso-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-perso.png">

    <link rel="stylesheet" href="assets/css/polices.css">
    <link rel="stylesheet" href="assets/css/portal.css">
</head>

<body>



    <div class="portal-index-root">

        <!-- HEADER / TOOLBAR -->
        <header class="ki-header">
            <div class="ki-toolbar">
                <div class="ki-fontrow">
                    <span class="ki-label" id="font-label">Font :</span>
                    <!-- Wrapper for alignment -->
                    <div style="position: relative; display: inline-flex; flex-direction: column;">
                        <button type="button" class="ki-trigger" id="font-trigger" aria-haspopup="menu"
                            aria-expanded="false" aria-controls="font-menu"
                            aria-labelledby="font-label current-font-name">
                            <span class="ki-lb">[</span>
                            <span class="ki-current" id="current-font-name">PxPlus_IBM_VGA8</span>
                            <span class="ki-rb">]</span>
                        </button>
                        <!-- MENU (aligné sur le trigger) -->
                        <div class="ki-menu" id="font-menu" role="menu" aria-labelledby="font-label">
                            <div class="ki-item" role="menuitem" tabindex="-1" data-font="PXVGA8">PxPlus_IBM_VGA8</div>
                            <div class="ki-item" role="menuitem" tabindex="-1" data-font="CascadiaMono">Cascadia Mono</div>
                            <div class="ki-item" role="menuitem" tabindex="-1" data-font="Tenebris">Tenebris</div>
                            <div class="ki-item" role="menuitem" tabindex="-1" data-font="TerminalGothic">Terminal Gothic</div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN GRID FRAME -->
        <main class="ki-frame">
            <div class="ki-grid">

                <!-- COLONNE GAUCHE -->
                <div class="ki-box ki-col-left">

                    <div class="ki-titlebar">
                        <h1>INDEX :: PERSO</h1>
                        <div class="ki-dotline"></div>
                        <span class="ki-count" data-count="items">004 item(s)</span><!-- valeur de secours, recalculée par portal.js -->
                    </div>

                    <div class="ki-prompt" aria-hidden="true">
                        <span class="ps-prefix">PS></span>
                        <span class="ps-query" id="typing-effect" data-text="load user_profile --force"></span><span
                            class="ki-caret"></span>
                    </div>

                    <nav class="ki-games" aria-labelledby="projects-title">
                        <h2 class="ki-section-title" id="projects-title">Projets & Pensées</h2>
                        <ul class="ki-list">
                            <li><a href="ascii.html">ASCII Archive</a></li>
                            <li><a href="#">Mon Obsidian</a></li>
                            <li><a href="musee.html">Musée</a></li>
                            <li><a href="sites.html">Sites utiles</a></li>
                        </ul>
                    </nav>

                    <nav class="ki-games" style="margin-top: 20px;" aria-labelledby="nav-title">
                        <h2 class="ki-section-title" id="nav-title">NAVIGATION</h2>
                        <ul class="ki-list">
                            <li><a href="index.html" aria-label="Retour Accueil"><span
                                        aria-hidden="true">&lt;&lt;</span> Retour</a></li>
                        </ul>
                    </nav>

                    <!-- BOTTOM DOTLINE (To close the 'notebook' box) -->


                </div>

                <!-- LIGNE DE SÉPARATION CENTRALE (SPIRALE) -->
                <div class="ki-spiral" aria-hidden="true">
                    <!-- Dynamic Generation via portal.js -->
                </div>

                <!-- COLONNE DROITE -->
                <div class="ki-box ki-col-right">

                    <div class="ki-creators">
                        <h2 class="ki-section-title">Inspirations</h2>
                        <ul class="ki-list">
                            <li><a href="https://littlebitspace.com/" target="_blank" rel="noopener noreferrer"
                                    aria-label="LittleBitSpace (nouvelle fenêtre)">LittleBitSpace</a></li>
                            <li><a href="portal.html">Portal</a></li>
                        </ul>
                    </div>

                    <div class="ki-flux-section">
                        <h2 class="ki-section-title">Flux</h2>
                        <div class="ki-art-wrap">
                            <div class="ki-art" role="img" aria-label="Illustration Fleurs du Mal en ASCII Art, animée"></div>
                        </div>
                    </div>


                </div>

            </div>

        </main>
    </div>

    <!-- SCRIPT ASCII ART DYNAMIQUE -->
    <script src="assets/js/fleurs_data.js"></script>
    <script src="assets/js/ascii-art.js"></script>
    <script src="assets/js/portal.js"></script>


</body>

</html>
